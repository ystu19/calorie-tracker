services:
  backend:
    build: ./backend
    container_name: calorie-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: calorie-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend